<section id="inicio" class="hero" aria-label="P7 Barber Master Studio">
  <div class="hero-media">
    <picture class="hero-poster-picture">
      <source media="(min-width: 1025px)" srcset="./assets/video/hero-poster-desktop.avif?v=20261124" type="image/avif">
      <source media="(min-width: 1025px)" srcset="./assets/video/hero-poster-desktop.webp?v=20261124" type="image/webp">
      <source media="(min-width: 1025px)" srcset="./assets/video/hero-poster-desktop.jpg?v=20261124" type="image/jpeg">
      <source srcset="./assets/video/hero-poster-mobile.avif?v=20261124" type="image/avif">
      <source srcset="./assets/video/hero-poster-mobile.webp?v=20261124" type="image/webp">
      <img
        src="./assets/video/hero-poster-mobile.jpg?v=20261124"
        alt="Interior de P7 Barber Master Studio en Palma de Mallorca"
        data-i18n-attr="alt:hero.posterAlt"
        class="hero-poster-media is-ken-burns"
        width="1080"
        height="1920"
        fetchpriority="high"
        decoding="async"
      >
    </picture>

    <video
      id="hero-video"
      class="hero-video"
      autoplay
      loop
      muted
      playsinline
      webkit-playsinline
      disablepictureinpicture
      disableremoteplayback
      preload="auto"
      width="1080"
      height="1920"
      aria-hidden="true"
      data-desktop-mp4="./assets/video/hero-ordenador.mp4?v=20261124"
      data-desktop-webm="./assets/video/hero-ordenador.webm?v=20261124"
      data-mobile-mp4="./assets/video/hero-movil-tablet.mp4?v=20261124"
      data-mobile-webm="./assets/video/hero-movil-tablet.webm?v=20261124"
    ></video>
    <script>
      (function () {
        var v = document.getElementById('hero-video');
        if (!v) return;
        var isDesktop = window.matchMedia('(min-width: 1025px)').matches;
        v.dataset.heroMode = isDesktop ? 'desktop' : 'mobile';
        v.muted = true;
        v.defaultMuted = true;
        v.loop = true;
        v.playsInline = true;
        v.width = isDesktop ? 1920 : 1080;
        v.height = isDesktop ? 1080 : 1920;
        var list = isDesktop
          ? [
              { src: v.dataset.desktopMp4, type: 'video/mp4' },
              { src: v.dataset.desktopWebm, type: 'video/webm' }
            ]
          : [
              { src: v.dataset.mobileMp4, type: 'video/mp4' },
              { src: v.dataset.mobileWebm, type: 'video/webm' }
            ];
        list.forEach(function (item) {
          if (!item.src) return;
          var s = document.createElement('source');
          s.src = item.src;
          s.type = item.type;
          v.appendChild(s);
        });
        v.load();
        var p = v.play();
        if (p && typeof p.catch === 'function') {
          v._initialPlayPromise = p;
          p.catch(function () {});
        }
      })();
    </script>
  </div>

  <!-- Bloque inferior centrado y limpio: título sencillo + botón Reservar cita con Liquid Glass -->
  <div class="hero-bottom-overlay">
    <h1 class="hero-simple-title" data-i18n="hero.title">Precisión en cada corte.</h1>
    <a href="#reserva" class="liquid-glass-btn">
      <span class="liquid-glass-surface" aria-hidden="true"></span>
      <span class="liquid-glass-blur" aria-hidden="true"></span>
      <span class="liquid-glass-label">
        <span data-i18n="hero.cta">Reservar cita</span>
      </span>
    </a>
  </div>
</section>

<!-- Filtro SVG de refracción Liquid Glass (disponible para toda la página) -->
<svg class="liquid-glass-svg" aria-hidden="true" focusable="false">
  <defs>
    <filter
      id="container-glass"
      x="0%"
      y="0%"
      width="100%"
      height="100%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.05 0.05"
        numOctaves="1"
        seed="1"
        result="turbulence"
      />
      <feGaussianBlur in="turbulence" stdDeviation="2" result="blurredNoise" />
      <feDisplacementMap
        in="SourceGraphic"
        in2="blurredNoise"
        scale="70"
        xChannelSelector="R"
        yChannelSelector="B"
        result="displaced"
      />
      <feGaussianBlur in="displaced" stdDeviation="4" result="finalBlur" />
      <feComposite in="finalBlur" in2="finalBlur" operator="over" />
    </filter>
  </defs>
</svg>

<!-- Separador fino Bandera de Colombia -->
<div class="colombia-divider" aria-hidden="true"></div>
