<section id="inicio" class="hero">
  <div class="hero-media">
    <picture class="hero-poster-picture">
      <source srcset="./assets/video/hero-poster.avif" type="image/avif">
      <source srcset="./assets/video/hero-poster.webp" type="image/webp">
      <img
        src="./assets/video/hero-poster.jpg"
        alt="Interior de P7 Barber Master Studio en Palma de Mallorca"
        class="hero-poster-media is-ken-burns"
        width="1920"
        height="1080"
        fetchpriority="high"
        decoding="async"
      >
    </picture>

    <video
      id="hero-video"
      class="hero-video"
      autoplay
      loop
      muted
      playsinline
      width="1920"
      height="1080"
      aria-hidden="true"
      poster="./assets/video/hero-poster.avif"
    >
      <source src="./assets/video/hero-9x16.webm" type="video/webm" media="(max-width: 767px)">
      <source src="./assets/video/hero-9x16.mp4" type="video/mp4" media="(max-width: 767px)">
      <source src="./assets/video/hero-16x9.webm" type="video/webm">
      <source src="./assets/video/hero-16x9.mp4" type="video/mp4">
    </video>

    <div class="hero-veil" aria-hidden="true"></div>
  </div>

  <div class="container hero-content">
    <div class="grid-12">
      <div class="hero-crest">
        <img
          src="./assets/img/opt/logo-p7-256w.webp"
          alt="Escudo gótico P7 Barber Master Studio"
          width="92"
          height="92"
          decoding="async"
        >
      </div>

      <div class="hero-title-wrap">
        <h1 class="h1-editorial">
          <span class="hero-line-mask"><span class="hero-line">Maestría en</span></span>
          <span class="hero-line-mask"><span class="hero-line hero-line-2">cada trazo.</span></span>
        </h1>
      </div>

      <div class="hero-sub-wrap">
        <p class="lead-copy">
          Barbería artesanal dirigida por Manu en Palma de Mallorca. Precisión colombiana, trato uno a uno y ritual de toalla caliente.
        </p>

        <div class="hero-actions">
          <a href="https://booksy.com/es-es/" target="_blank" rel="noopener noreferrer" class="btn-gold-metallic">
            Reservar cita
          </a>
          <a href="https://www.setmore.com/" target="_blank" rel="noopener noreferrer" class="link-subtle">
            O reserva en Setmore
          </a>
        </div>

        <div class="hero-meta-row">
          <p class="hero-meta-note">C/ Miguel Ángel Riera, 2 · Palma · 5,0 en Booksy</p>
          <button
            type="button"
            id="hero-video-toggle"
            class="hero-video-toggle"
            aria-pressed="false"
          >
            Pausar ambiente
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
