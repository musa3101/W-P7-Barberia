<section id="inicio" class="hero" aria-label="P7 Barber Master Studio">
  <div class="hero-media">
    <picture class="hero-poster-picture">
      <source srcset="./assets/video/hero-poster.avif" type="image/avif">
      <source srcset="./assets/video/hero-poster.webp" type="image/webp">
      <img
        src="./assets/video/hero-poster.jpg"
        alt="Interior de P7 Barber Master Studio en Palma de Mallorca"
        class="hero-poster-media is-ken-burns"
        width="1920"
        height="1080"
        fetchpriority="high"
        decoding="async"
      >
    </picture>

    <video
      id="hero-video"
      class="hero-video"
      autoplay
      loop
      muted
      playsinline
      width="1920"
      height="1080"
      aria-hidden="true"
      poster="./assets/video/hero-poster.avif"
    >
      <source src="./assets/video/hero-9x16.webm" type="video/webm" media="(max-width: 767px)">
      <source src="./assets/video/hero-9x16.mp4" type="video/mp4" media="(max-width: 767px)">
      <source src="./assets/video/hero-16x9.webm" type="video/webm">
      <source src="./assets/video/hero-16x9.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Bloque inferior centrado y limpio: título sencillo + botón Reservar cita -->
  <div class="hero-bottom-overlay">
    <h1 class="hero-simple-title">Precisión en cada corte.</h1>
    <a href="#reserva" class="hero-simple-btn">Reservar cita</a>
  </div>
</section>

<!-- Separador fino Bandera de Colombia -->
<div class="colombia-divider" aria-hidden="true"></div>

<!-- ==========================================================================
     MINI SECCIÓN · CINTA EDITORIAL RECTA P7 (Negro Carbono + Letras Blancas)
     Puente limpio entre el Hero y Sobre nosotros
     ========================================================================== -->
<section id="p7-ribbon-section" class="p7-ribbon-section" aria-label="P7 Barber Master Studio — Palma de Mallorca">
  <div class="p7-ribbon-viewport">
    <div class="p7-ribbon-track">
      <div class="p7-ribbon-group">
        <span class="p7-ribbon-item">P7 MASTER STUDIO</span>
        <span class="p7-ribbon-sep" aria-hidden="true">✦</span>
        <span class="p7-ribbon-item">PALMA DE MALLORCA</span>
        <span class="p7-ribbon-sep" aria-hidden="true">✦</span>
        <span class="p7-ribbon-item">5,0 ★ BOOKSY</span>
        <span class="p7-ribbon-sep" aria-hidden="true">✦</span>
        <span class="p7-ribbon-item">CORTE &amp; BARBA</span>
        <span class="p7-ribbon-sep" aria-hidden="true">✦</span>
        <span class="p7-ribbon-item">SINCE 2023</span>
        <span class="p7-ribbon-sep" aria-hidden="true">✦</span>
      </div>
    </div>
  </div>
</section>
