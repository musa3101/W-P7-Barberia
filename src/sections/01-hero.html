<section id="inicio" class="hero" aria-label="P7 Barber Master Studio">
  <div class="hero-media">
    <picture class="hero-poster-picture">
      <source srcset="./assets/video/hero-poster.avif" type="image/avif">
      <source srcset="./assets/video/hero-poster.webp" type="image/webp">
      <img
        src="./assets/video/hero-poster.jpg"
        alt="Interior de P7 Barber Master Studio en Palma de Mallorca"
        class="hero-poster-media is-ken-burns"
        width="1920"
        height="1080"
        fetchpriority="high"
        decoding="async"
      >
    </picture>

    <video
      id="hero-video"
      class="hero-video"
      autoplay
      loop
      muted
      playsinline
      width="1920"
      height="1080"
      aria-hidden="true"
      poster="./assets/video/hero-poster.avif"
    >
      <source src="./assets/video/hero-9x16.webm" type="video/webm" media="(max-width: 767px)">
      <source src="./assets/video/hero-9x16.mp4" type="video/mp4" media="(max-width: 767px)">
      <source src="./assets/video/hero-16x9.webm" type="video/webm">
      <source src="./assets/video/hero-16x9.mp4" type="video/mp4">
    </video>
  </div>

  <!-- Bloque inferior centrado y limpio: título sencillo + botón Reservar cita con Liquid Glass -->
  <div class="hero-bottom-overlay">
    <h1 class="hero-simple-title">Precisión en cada corte.</h1>
    <a href="#reserva" class="liquid-glass-btn">
      <span class="liquid-glass-surface" aria-hidden="true"></span>
      <span class="liquid-glass-blur" aria-hidden="true"></span>
      <span class="liquid-glass-label">
        <span>Reservar cita</span>
      </span>
    </a>
  </div>
</section>

<!-- Filtro SVG de refracción Liquid Glass (disponible para toda la página) -->
<svg class="liquid-glass-svg" aria-hidden="true" focusable="false">
  <defs>
    <filter
      id="container-glass"
      x="0%"
      y="0%"
      width="100%"
      height="100%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.05 0.05"
        numOctaves="1"
        seed="1"
        result="turbulence"
      />
      <feGaussianBlur in="turbulence" stdDeviation="2" result="blurredNoise" />
      <feDisplacementMap
        in="SourceGraphic"
        in2="blurredNoise"
        scale="70"
        xChannelSelector="R"
        yChannelSelector="B"
        result="displaced"
      />
      <feGaussianBlur in="displaced" stdDeviation="4" result="finalBlur" />
      <feComposite in="finalBlur" in2="finalBlur" operator="over" />
    </filter>
  </defs>
</svg>

<!-- Separador fino Bandera de Colombia -->
<div class="colombia-divider" aria-hidden="true"></div>
