      <!-- 3. Botón de cierre Liquid Glass: Ver nuestro equipo -->
      <div class="sobre-v2-actions" data-reveal>
        <a
          href="./equipo.html"
          target="_blank"
          rel="noopener noreferrer"
          class="liquid-glass-btn"
          aria-label="Ver nuestro equipo (se abre en una pestaña nueva)"
        >
          <span class="liquid-glass-surface" aria-hidden="true"></span>
          <span class="liquid-glass-blur" aria-hidden="true"></span>
          <span class="liquid-glass-label">
            <span>Ver nuestro equipo</span>
            <svg
              class="sobre-v2-cta-arrow"
              width="17"
              height="17"
              viewBox="0 0 18 18"
              fill="none"
              aria-hidden="true"
            >
              <path
                d="M5 13L13 5M13 5H6.5M13 5V11.5"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="square"
              />
            </svg>
          </span>
        </a>

        <svg class="liquid-glass-svg" aria-hidden="true" focusable="false">
          <defs>
            <filter
              id="container-glass"
              x="0%"
              y="0%"
              width="100%"
              height="100%"
              color-interpolation-filters="sRGB"
            >
              <feTurbulence
                type="fractalNoise"
                baseFrequency="0.05 0.05"
                numOctaves="1"
                seed="1"
                result="turbulence"
              />
              <feGaussianBlur in="turbulence" stdDeviation="2" result="blurredNoise" />
              <feDisplacementMap
                in="SourceGraphic"
                in2="blurredNoise"
                scale="70"
                xChannelSelector="R"
                yChannelSelector="B"
                result="displaced"
              />
              <feGaussianBlur in="displaced" stdDeviation="4" result="finalBlur" />
              <feComposite in="finalBlur" in2="finalBlur" operator="over" />
            </filter>
          </defs>
        </svg>
